<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilChat</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><div class="login"><div class="card"><div class="brandmark">V</div><h2 style="margin:13px 0 6px">VeilChat</h2><p class="hint">A fresh private-chat experience. Your display name is used only for this testing app.</p><input id="name" class="field" maxlength="40" placeholder="Display name"><button class="primary" onclick="enter()">Continue</button></div></div></div><script>function enter(){const n=document.getElementById('name').value.trim();if(!n)return alert('Enter a display name');const uid='v_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2));localStorage.setItem('veil_user',JSON.stringify({uid,name:n}));location.href='index.html'}</script></body></html>
