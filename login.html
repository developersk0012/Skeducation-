<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiddenChat • Login</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><div class="login"><div class="loginCard"><div class="avatar">HC</div><h2>HiddenChat</h2><p>Private 1-to-1 messaging with a clean, WhatsApp-inspired interface.</p><input id="name" maxlength="40" placeholder="Your display name"><button class="primary" style="margin-top:12px;width:100%" onclick="go()">Enter chat</button></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script><script>if(getUser())location.href="index.html";function go(){let n=document.getElementById('name').value.trim();if(!n)return alert('Enter your name');setUser(n);location.href='index.html'}</script></body></html>
