<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilChat</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><div class="login"><div class="card"><div class="logo">V</div><h2>VeilChat</h2><p class="hint">A completely separate testing chat. It does not use the SK Education database structure.</p><input id="name" class="field" maxlength="40" placeholder="Display name"><button class="primary" onclick="go()">Enter VeilChat</button><button class="adminlink" onclick="location.href='admin.html'">🛠️ Admin Panel</button></div></div></div><script>function go(){let n=name.value.trim();if(!n)return alert("Enter your name");let uid="u_"+(crypto.randomUUID?crypto.randomUUID():Date.now());localStorage.setItem("veil_v2_user",JSON.stringify({uid,name:n}));location.href="index.html"}</script></body></html>
