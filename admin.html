<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiddenChat Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><div class="avatar">A</div><div><h1>HiddenChat Admin</h1><small id="aStatus">Messages & controls</small></div><div class="spacer"></div><button class="iconbtn" onclick="location.href='index.html'">↩</button></header><div class="layout"><aside class="sidebar"><div class="search"><input id="q" placeholder="Search users..." oninput="renderUsers()"></div><div id="users" class="chatlist"></div></aside><main class="main"><div id="empty" class="empty"><div style="font-size:42px">🛠️</div><h2>Admin inbox</h2><p>Select a user.</p></div><div id="chat" style="display:none;height:100%;min-height:0;flex-direction:column"><div class="top" style="height:58px"><div class="avatar" id="av">?</div><div><h1 id="pn">User</h1><small id="ps">offline</small></div><div class="spacer"></div><button class="iconbtn" onclick="clearChat()">🧹</button></div><div id="typing" class="typing"></div><div id="msgs" class="messages"></div><div class="composer"><div class="attachWrap" id="aw"><button class="round" onclick="toggleAttach()">＋</button><div class="attachMenu"><button onclick="sendAdminLink()">🔗 Link</button><button onclick="adminPoll()">📊 Poll</button></div></div><textarea id="input" rows="1" placeholder="Message user..." oninput="setTyping(true)" onkeydown="keySend(event)"></textarea><button class="round send" onclick="send()">➤</button></div></div></main></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script><script>
let peer=null,ref=null,users={};if(sessionStorage.getItem('hc_admin')!=='1'){let p=prompt('Admin password');if(p!==ADMIN_PASSWORD){location.href='login.html'}else sessionStorage.setItem('hc_admin','1')}
db.ref('chat_users').on('value',s=>{users=s.val()||{};renderUsers()});
function renderUsers(){let q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('users').innerHTML=Object.entries(users).filter(([id,u])=>(u.name||'').toLowerCase().includes(q)).map(([id,u])=>`<div class="chatrow" onclick="openUser('${id}')"><div class="avatar">${esc((u.name||'?')[0])}</div><div class="meta"><b>${esc(u.name||'User')}</b><p>${u.online?'🟢 online':'offline'}</p></div></div>`).join('')||'<div style="padding:20px;color:#8299a8">No users.</div>'}
function chatPath(){return 'private_chats/'+['admin',peer.uid].sort().join('__')+'/messages'}
function openUser(uid){peer={uid,name:users[uid]?.name||'User'};document.getElementById('empty').style.display='none';document.getElementById('chat').style.display='flex';pn.textContent=peer.name;av.textContent=peer.name[0].toUpperCase();ps.textContent=users[uid]?.online?'online':'offline';if(ref)ref.off();ref=db.ref(chatPath());ref.on('value',s=>render(s.val()||{}));db.ref('private_chats/'+['admin',uid].sort().join('__')+'/typing/'+uid).on('value',s=>typing.textContent=s.val()?.typing?'typing…':'')}
function render(data){msgs.innerHTML=Object.entries(data).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0)).map(([id,m])=>bubble(id,m)).join('');msgs.scrollTop=msgs.scrollHeight}
function bubble(id,m){let mine=m.sender==='admin';let reaction=m.reactions?Object.values(m.reactions).join(' '):'';let body=m.type==='link'?`🔗 <a href="${esc(m.url)}" target="_blank">${esc(m.url)}</a>`:m.type==='poll'?poll(id,m):`<div class="msgtext">${esc(m.text||'')}</div>`;return `<div class="msg ${mine?'mine':''}" id="m_${id}" onclick="toggle('${id}',event)"><div class="bubble">${body}<div class="metaLine">${fmtTime(m.ts)} ${mine?'✓✓':''}</div>${reaction?`<span class="reaction">${esc(reaction)}</span>`:''}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="reply('${id}')">↩ Reply</button><button onclick="react('${id}')">😊 React</button><button onclick="del('${id}')">🗑 Delete</button></div></div>`}
function toggle(id,e){if(e.target.closest('.actions'))return;document.querySelectorAll('.msg.open').forEach(x=>x.classList.remove('open'));document.getElementById('m_'+id)?.classList.add('open')}
function sendBase(o){o.sender='admin';o.senderName='Admin';o.ts=firebase.database.ServerValue.TIMESTAMP;return ref.push().set(o)}
function send(){let t=input.value.trim();if(!t)return;sendBase({type:'text',text:t});input.value='';setTyping(false)}
function keySend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function reply(id){ref.child(id).once('value').then(s=>{input.value='';input.placeholder='Reply: '+(s.val()?.text||'message');window.replyTo={id,text:s.val()?.text||'message'}});closeActions()}
function react(id){showEmoji(e=>ref.child(id).child('reactions').child('admin').set(e));closeActions()}
function del(id){if(confirm('Delete this message?'))ref.child(id).remove();closeActions()}
function closeActions(){document.querySelectorAll('.msg.open').forEach(x=>x.classList.remove('open'))}
function showEmoji(cb){modal.innerHTML='<div class="modal"><h3>Choose reaction</h3><div class="emojiGrid">'+['❤️','👍','😂','😮','😢','🔥','👏','🙏'].map(e=>`<button onclick="cbReact('${e}')">${e}</button>`).join('')+'</div></div>';modal.classList.add('show');window.cbReact=e=>{cb(e);modal.classList.remove('show')}}
function toggleAttach(){aw.classList.toggle('open')}
function sendAdminLink(){let u=prompt('Link:');if(u)sendBase({type:'link',url:u});aw.classList.remove('open')}
function adminPoll(){let q=prompt('Question:');if(!q)return;let o=prompt('Options separated by |','Yes|No');if(o)sendBase({type:'poll',question:q,options:o.split('|').map(x=>x.trim()),votes:{}});aw.classList.remove('open')}
function poll(id,m){return `<div class="poll"><b>📊 ${esc(m.question)}</b>${(m.options||[]).map((o,i)=>`<button onclick="ref.child('${id}').child('votes').child('${i}').child('admin').set(true)">${esc(o)}</button>`).join('')}</div>`}
function setTyping(v){if(!peer)return;db.ref('private_chats/'+['admin',peer.uid].sort().join('__')+'/typing/admin').set({typing:v,ts:firebase.database.ServerValue.TIMESTAMP});if(v){clearTimeout(window.tt);window.tt=setTimeout(()=>setTyping(false),1400)}}
function clearChat(){if(ref&&confirm('Delete all messages in this chat?'))ref.remove()}
</script><div id="modal" class="modalBack" onclick="if(event.target===this)this.classList.remove('show')"></div></body></html>
