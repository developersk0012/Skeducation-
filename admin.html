<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilChat Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><div class="logo">A</div><div><div class="title">VeilChat Control</div><div class="sub">Admin inbox • testing project</div></div><div class="grow"></div><button class="icon" onclick="location.href='index.html'">↩</button></header><div class="layout"><aside class="side"><div class="search"><input id="q" placeholder="Search users…" oninput="drawUsers()"></div><div id="users" class="list"></div></aside><main class="main"><div id="empty" class="welcome"><div class="hero">🛠️</div><h2>Admin Inbox</h2><p>Select a user.</p></div><div id="chat" class="chat"><div class="chathead"><button class="icon back" onclick="closeChat()">←</button><div class="ava" id="ava">?</div><div><div class="title" id="name">User</div><div class="status" id="status">offline</div></div><div class="grow"></div><button class="icon" onclick="findChat()">⌕</button></div><div id="typing" class="typing"></div><div id="messages" class="messages"></div><div class="composer"><div class="attach" id="attach"><button class="round" onclick="attach.classList.toggle('open')">＋</button><div class="sheet"><button onclick="sendLink()">🔗 Link</button><button onclick="makePoll()">📊 Poll</button></div></div><textarea id="input" placeholder="Write to user…" oninput="typeNow()" onkeydown="keySend(event)"></textarea><button class="round send" onclick="send()">➤</button></div></div></main></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script><script>
let users={},peer=null,ref=null,tref=null,tt=null,reply=null;
let pass=sessionStorage.getItem("veil_v2_admin");if(!pass){pass=prompt("Admin password");if(pass!=="seema12345"){location.href="login.html"}else sessionStorage.setItem("veil_v2_admin","1")}
db.ref(NS+"/users").on("value",s=>{users=s.val()||{};drawUsers()});
function drawUsers(){let q=(document.getElementById("q").value||"").toLowerCase();usersEl=document.getElementById("users");let arr=Object.entries(users).filter(([id,u])=>(u.name||"").toLowerCase().includes(q));usersEl.innerHTML=arr.map(([id,u])=>`<div class="row" onclick="openUser('${id}')"><div class="ava">${esc((u.name||"?")[0].toUpperCase())}</div><div class="rmain"><div class="rline"><b>${esc(u.name||"User")}</b><span class="time">${u.online?"online":""}</span></div><div class="preview">${u.online?"🟢 online":"last seen"}</div></div></div>`).join("")||'<div class="emptylist">No users have entered the app yet.</div>'}
function key(){return [ADMIN_ID,peer.uid].sort().join("__")}function path(){return NS+"/chats/"+key()+"/messages"}function openUser(id){peer={uid:id,name:users[id]?.name||"User"};empty.style.display="none";chat.style.display="flex";name.textContent=peer.name;ava.textContent=peer.name[0].toUpperCase();status.textContent=users[id]?.online?"online":"offline";if(ref)ref.off();if(tref)tref.off();ref=db.ref(path());ref.on("value",s=>render(s.val()||{}));tref=db.ref(NS+"/chats/"+key()+"/typing/"+id);tref.on("value",s=>typing.textContent=s.val()?.typing?"typing…":"")}
function closeChat(){if(ref)ref.off();if(tref)tref.off();chat.style.display="none";empty.style.display="block"}
function render(data){messages.innerHTML=Object.entries(data).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0)).map(([id,m])=>bubble(id,m)).join("");messages.scrollTop=messages.scrollHeight}
function bubble(id,m){let mine=m.sender===ADMIN_ID;let body=m.type==="poll"?poll(id,m):m.type==="link"?`🔗 <a href="${esc(m.url)}" target="_blank" style="color:#70dfad">${esc(m.url)}</a>`:`<div class="text">${esc(m.text||"")}</div>`;let rx=m.reactions?Object.values(m.reactions).join(" "):"";return `<div class="msg ${mine?"mine":""}" id="m_${id}" onclick="act('${id}',event)"><div class="bubble">${m.replyText?`<div class="reply">↩ ${esc(m.replyText)}</div>`:""}${body}<div class="meta">${time(m.ts)} ${mine?"✓✓":""}</div>${rx?`<span class="reaction">${esc(rx)}</span>`:""}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="replyMsg('${id}')">↩ Reply</button><button onclick="react('${id}')">😊 React</button><button onclick="del('${id}')">🗑 Delete</button></div></div>`}
function act(id,e){if(e.target.closest(".actions"))return;document.querySelectorAll(".msg.open").forEach(x=>x.classList.remove("open"));document.getElementById("m_"+id)?.classList.add("open")}
function closeActions(){document.querySelectorAll(".msg.open").forEach(x=>x.classList.remove("open"))}
function base(o){let r=ref.push();o.sender=ADMIN_ID;o.senderName="Admin";o.ts=firebase.database.ServerValue.TIMESTAMP;if(reply){o.replyId=reply.id;o.replyText=reply.text;reply=null;input.placeholder="Write to user…"}return r.set(o)}
function send(){let v=input.value.trim();if(!v)return;base({type:"text",text:v});input.value="";typeNow(false)}
function keySend(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}
function replyMsg(id){ref.child(id).once("value").then(s=>{let m=s.val()||{};reply={id,text:m.text||m.name||"message"};input.placeholder="Reply: "+reply.text;input.focus();closeActions()})}
function react(id){modal.innerHTML='<div class="card"><h3>React</h3><div class="emoji">'+["❤️","👍","😂","😮","😢","🔥","👏","🙏"].map(e=>`<button onclick="setRx('${id}','${e}')">${e}</button>`).join("")+"</div></div>";modal.classList.add("show");closeActions()}
function setRx(id,e){ref.child(id).child("reactions").child(ADMIN_ID).set(e);modal.classList.remove("show")}
function del(id){if(confirm("Delete message?"))ref.child(id).remove();closeActions()}
function typeNow(v=true){if(!peer)return;db.ref(NS+"/chats/"+key()+"/typing/"+ADMIN_ID).set({typing:v,ts:firebase.database.ServerValue.TIMESTAMP});clearTimeout(tt);if(v)tt=setTimeout(()=>typeNow(false),1400)}
function sendLink(){let u=prompt("Paste link");if(u)base({type:"link",url:u});attach.classList.remove("open")}
function makePoll(){let q=prompt("Poll question");if(!q)return;let o=prompt("Options separated by |","Yes|No");if(o)base({type:"poll",question:q,options:o.split("|").map(x=>x.trim()).filter(Boolean),votes:{}});attach.classList.remove("open")}
function poll(id,m){return `<div class="poll"><strong>📊 ${esc(m.question)}</strong>${(m.options||[]).map((o,i)=>`<button onclick="event.stopPropagation();ref.child('${id}').child('votes').child('${i}').child('${ADMIN_ID}').set(true)">${esc(o)}</button>`).join("")}</div>`}
function findChat(){let q=prompt("Search");if(!q)return;let n=[...document.querySelectorAll(".text")].find(x=>x.textContent.toLowerCase().includes(q.toLowerCase()));n?.scrollIntoView({behavior:"smooth",block:"center"})}
</script></body></html>
