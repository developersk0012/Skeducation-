<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat</title><link rel="stylesheet" href="style.css"><style>
body{background:#07111f}.hc{height:100dvh;display:flex;flex-direction:column}.hc-head{height:70px;background:#0b1726;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px;padding:10px 13px;z-index:5}.hc-avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00b894,#3f51ff);font-weight:800}.hc-title{font-weight:800;font-size:16px}.hc-sub{font-size:12px;color:#8fa0b7;margin-top:2px}.hc-spacer{flex:1}.hc-btn{width:40px;height:40px;border-radius:13px;background:#122235;color:#eaf2ff}.hc-messages{flex:1;min-height:0;overflow:auto;padding:13px 10px 10px;display:flex;flex-direction:column;gap:5px}.hc-day{text-align:center;color:#899cb2;font-size:10px;margin:8px auto;background:#112234;padding:5px 10px;border-radius:20px}.hc-row{max-width:86%;display:flex;flex-direction:column;position:relative}.hc-row.me{align-self:flex-end;align-items:flex-end}.hc-row.them{align-self:flex-start;align-items:flex-start}.hc-bubble{padding:8px 10px;border-radius:15px 15px 15px 4px;background:#14283b;border:1px solid #203b51;box-shadow:0 4px 16px #0003;font-size:14px;line-height:1.38;white-space:pre-wrap;word-break:break-word}.hc-row.me .hc-bubble{background:linear-gradient(135deg,#5a4bea,#7147e8);border-color:#7868ff;border-radius:15px 15px 4px 15px}.hc-meta{font-size:9px;color:#a8b8c8;opacity:.8;text-align:right;margin-top:3px}.hc-reply{border-left:3px solid #77e5bb;background:#ffffff0b;padding:5px 7px;border-radius:7px;margin-bottom:6px;font-size:11px;color:#b8cad8}.hc-actions{display:none;position:absolute;z-index:30;top:100%;right:0;background:#122231;border:1px solid #2b4559;border-radius:12px;padding:5px;min-width:150px;box-shadow:0 18px 40px #000b}.hc-row.open .hc-actions{display:block}.hc-actions button{display:block;width:100%;text-align:left;background:transparent;padding:9px;border-radius:8px}.hc-actions button:hover{background:#203647}.hc-reaction{font-size:12px;background:#10212e;border:1px solid #2d4a5d;border-radius:14px;padding:2px 7px;margin-top:2px}.hc-typing{height:18px;padding:0 14px;color:#72ddb1;font-size:11px}.hc-composer{display:flex;gap:7px;align-items:flex-end;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#0a1622;border-top:1px solid rgba(255,255,255,.08)}.hc-input{flex:1;min-width:0;resize:none;max-height:100px;min-height:42px;border-radius:21px;border:1px solid #233c50;background:#101f2e;color:#fff;padding:10px 14px;outline:none}.hc-send,.hc-plus{width:44px;height:44px;border-radius:50%;flex:0 0 auto}.hc-send{background:linear-gradient(135deg,#6a55ff,#4d38df);font-size:20px}.hc-plus{background:#15283a;font-size:24px}.hc-plus-wrap{position:relative}.hc-menu{display:none;position:absolute;bottom:51px;left:0;background:#132535;border:1px solid #294355;border-radius:14px;padding:6px;min-width:165px;box-shadow:0 18px 40px #000b}.hc-plus-wrap.open .hc-menu{display:block}.hc-menu button{display:block;width:100%;text-align:left;background:transparent;padding:10px;border-radius:9px}.hc-menu button:hover{background:#203a4b}.hc-modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:100;padding:18px}.hc-modal.show{display:grid}.hc-card{width:min(420px,100%);background:#0e1d2a;border:1px solid #294354;border-radius:18px;padding:17px}.hc-emojis{display:flex;gap:7px;flex-wrap:wrap}.hc-emojis button{font-size:23px;background:#142a39;border-radius:10px;padding:8px}.hc-poll{background:#102534;border:1px solid #2b4658;border-radius:13px;padding:10px}.hc-poll b{display:block;margin-bottom:7px}.hc-poll button{display:block;width:100%;text-align:left;background:#183342;padding:8px;border-radius:8px;margin-top:5px;color:#fff}.hc-file{background:#102737;border:1px solid #29485a;border-radius:12px;padding:10px}.hc-file a{color:#7be3b4;text-decoration:none}.hc-login{height:100%;display:grid;place-items:center;padding:20px}.hc-login .card{width:min(390px,100%);background:#0e1c29;border:1px solid #294153;border-radius:22px;padding:22px}.hc-login input{width:100%;padding:12px;border-radius:12px;background:#102131;color:#fff;border:1px solid #294153}.hc-primary{width:100%;padding:12px;border-radius:12px;background:#20c77a;color:#042116;font-weight:800;margin-top:10px}
</style></head><body><div id="root"></div><input id="file" type="file" hidden><div id="modal" class="hc-modal"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script><script src="config.js"></script><script>
const root=document.getElementById('root');let uid=getUserId(),name=getUserName()||'',active=null,ref=null,typingTimer=null,replyTo=null;let storage=null;try{storage=firebase.storage()}catch(e){}
if(!name){root.innerHTML='<div class="hc"><div class="hc-login"><div class="card"><div class="hc-avatar">HC</div><h2>Private Chat</h2><p style="color:#8fa0b7">Choose a display name to continue.</p><input id="loginName" maxlength="40" placeholder="Your name"><button class="hc-primary" onclick="enter()">Continue</button></div></div></div>'}else render();
function enter(){let n=document.getElementById('loginName').value.trim();if(!n)return alert('Enter your name');setUserName(n);name=n;render()}
function render(){root.innerHTML=`<div class="hc"><header class="hc-head"><div class="hc-avatar">${esc(name[0]||'U')}</div><div><div class="hc-title">HiddenChat</div><div class="hc-sub" id="presence">Private chat</div></div><div class="hc-spacer"></div><button class="hc-btn" onclick="location.href='index.html'">⌂</button><button class="hc-btn" onclick="location.reload()">⋮</button></header><div id="typing" class="hc-typing"></div><div id="messages" class="hc-messages"><div style="margin:auto;color:#8fa0b7;text-align:center">Waiting for admin…</div></div><div class="hc-composer"><div class="hc-plus-wrap" id="plusWrap"><button class="hc-plus" onclick="togglePlus()">＋</button><div class="hc-menu"><button onclick="sendLink()">🔗 Link</button><button onclick="createPoll()">📊 Poll</button><button onclick="chooseFile('image/*')">📷 Photo</button><button onclick="chooseFile('video/*')">🎥 Video</button><button onclick="chooseFile('.pdf,.doc,.docx,.txt')">📄 Document</button></div></div><textarea id="input" class="hc-input" rows="1" placeholder="Message..." oninput="typing()" onkeydown="key(event)"></textarea><button class="hc-send" onclick="sendText()">➤</button></div></div>`;watch();}
function watch(){ref=db.ref('chats/'+uid);ref.on('value',s=>{let d=s.val()||{};active=d;renderMessages(d.messages||{});document.getElementById('presence').textContent=d.admin_online?'online':'Private chat'});db.ref('chats/'+uid+'/typing/admin').on('value',s=>document.getElementById('typing').textContent=s.val()?.typing?'typing…':'');db.ref('chats/'+uid).update({user_name:name,user_online:true,last_seen:new Date().toISOString()});db.ref('chats/'+uid).onDisconnect().update({user_online:false,last_seen:new Date().toISOString()})}
function renderMessages(data){let el=document.getElementById('messages');let arr=Object.entries(data).sort((a,b)=>(a[1].timestamp||0)-(b[1].timestamp||0));el.innerHTML=arr.map(([id,m])=>bubble(id,m)).join('')||'<div style="margin:auto;color:#8fa0b7;text-align:center">No messages yet.</div>';el.scrollTop=el.scrollHeight}
function bubble(id,m){let mine=m.sender==='user',body='';if(m.type==='link')body=`🔗 <a href="${esc(m.url||'#')}" target="_blank" rel="noopener" style="color:#bdefff">${esc(m.url||'Link')}</a>`;else if(m.type==='file')body=`<div class="hc-file">📎 <b>${esc(m.name||'File')}</b><br><a href="${esc(m.url||'#')}" target="_blank" rel="noopener">Open file</a></div>`;else if(m.type==='poll')body=poll(id,m);else body=esc(m.message||m.text||'');let rx=m.reactions?Object.values(m.reactions).join(' '):'';return `<div class="hc-row ${mine?'me':'them'}" id="row_${id}" onclick="openActions('${id}',event)"><div class="hc-bubble">${m.reply_text?`<div class="hc-reply">↩ ${esc(m.reply_text)}</div>`:''}<div>${body}</div><div class="hc-meta">${time(m.timestamp||m.ts)} ${mine?(m.read?'✓✓':'✓'):''}</div>${rx?`<div class="hc-reaction">${esc(rx)}</div>`:''}</div><div class="hc-actions" onclick="event.stopPropagation()"><button onclick="reply('${id}')">↩ Reply</button><button onclick="react('${id}')">😊 React</button>${mine?`<button onclick="edit('${id}')">✏️ Edit</button><button onclick="del('${id}')">🗑 Delete</button>`:''}<button onclick="copy('${id}')">📋 Copy</button><button onclick="pin('${id}')">📌 Pin</button></div></div>`}
function openActions(id,e){if(e.target.closest('.hc-actions'))return;document.querySelectorAll('.hc-row.open').forEach(x=>x.classList.remove('open'));document.getElementById('row_'+id)?.classList.add('open')}
function closeActions(){document.querySelectorAll('.hc-row.open').forEach(x=>x.classList.remove('open'))}
function base(o){o.sender='user';o.sender_name=name;o.timestamp=firebase.database.ServerValue.TIMESTAMP;if(replyTo){o.reply_to=replyTo.id;o.reply_text=replyTo.text}let r=ref.child('messages').push();return r.set(o).then(()=>ref.update({user_name:name,last_message:o.message||o.text||o.type,last_sender:'user',last_timestamp:new Date().toISOString()}))}
function sendText(){let t=input.value.trim();if(!t)return;base({type:'text',message:t}).then(()=>{input.value='';replyTo=null;input.placeholder='Message...';setTyping(false);try{sendUserMessage(name,t,replyTo?.text||null)}catch(e){}})}
function reply(id){ref.child('messages/'+id).once('value').then(s=>{let m=s.val()||{};replyTo={id,text:m.message||m.text||m.question||'message'};input.placeholder='Reply: '+replyTo.text;input.focus();closeActions()})}
function react(id){emoji(e=>ref.child('messages/'+id+'/reactions/'+uid).set(e));closeActions()}
function edit(id){ref.child('messages/'+id).once('value').then(s=>{let m=s.val()||{};let t=prompt('Edit message:',m.message||'');if(t!==null&&t.trim())ref.child('messages/'+id).update({message:t.trim(),edited:true});closeActions()})}
function del(id){if(confirm('Delete this message?'))ref.child('messages/'+id).remove();closeActions()}
function copy(id){ref.child('messages/'+id).once('value').then(s=>navigator.clipboard?.writeText(s.val()?.message||s.val()?.text||s.val()?.url||''));closeActions()}
function pin(id){ref.update({pinned_message:id});alert('Pinned');closeActions()}
function emoji(cb){modal.innerHTML='<div class="hc-card"><h3>Reaction</h3><div class="hc-emojis">'+['❤️','👍','😂','😮','😢','🔥','👏','🙏'].map(e=>`<button onclick="pickEmoji('${e}')">${e}</button>`).join('')+'</div></div>';modal.classList.add('show');window.pickEmoji=e=>{cb(e);modal.classList.remove('show')}}
function sendLink(){let u=prompt('Paste link');if(u)base({type:'link',url:u});plusWrap.classList.remove('open')}
function createPoll(){let q=prompt('Poll question');if(!q)return;let o=prompt('Options separated by |','Yes|No');if(o)base({type:'poll',question:q,options:o.split('|').map(x=>x.trim()).filter(Boolean),votes:{}});plusWrap.classList.remove('open')}
function poll(id,m){return `<div class="hc-poll"><b>📊 ${esc(m.question||'Poll')}</b>${(m.options||[]).map((o,i)=>`<button onclick="event.stopPropagation();vote('${id}',${i})">${esc(o)}</button>`).join('')}</div>`}
function vote(id,i){ref.child('messages/'+id+'/votes/'+i+'/'+uid).set(true)}
function chooseFile(acc){file.accept=acc;file.click();plusWrap.classList.remove('open');file.onchange=()=>upload(file.files[0])}
async function upload(f){if(!f||!storage)return;if(f.size>30*1024*1024)return alert('File must be under 30MB');let safe=f.name.replace(/[^a-z0-9._-]/gi,'_');let r=storage.ref('chat_files/'+uid+'/'+Date.now()+'_'+safe);try{let s=await r.put(f),url=await s.ref.getDownloadURL();await base({type:'file',name:f.name,url,mime:f.type,size:f.size})}catch(e){alert('Upload failed: '+e.message)}}
function togglePlus(){plusWrap.classList.toggle('open')}
function typing(){setTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>setTyping(false),1400)}
function setTyping(v){db.ref('chats/'+uid+'/typing/user').set({typing:v,ts:firebase.database.ServerValue.TIMESTAMP})}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}}
function time(t){return new Intl.DateTimeFormat([],{hour:'2-digit',minute:'2-digit'}).format(new Date(t||Date.now()))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
