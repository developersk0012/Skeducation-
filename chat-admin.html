<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat Admin</title><link rel="stylesheet" href="style.css"><style>
body{background:#07111f}.a{height:100dvh;display:flex;flex-direction:column}.head{height:68px;background:#0b1726;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding:9px 12px}.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff4f9a,#635bff);font-weight:900}.sp{flex:1}.btn{width:40px;height:40px;border-radius:12px;background:#132438;color:#fff}.layout{flex:1;min-height:0;display:flex}.users{width:300px;min-height:0;overflow:auto;background:#0b1723;border-right:1px solid rgba(255,255,255,.08)}.search{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}.search input{width:100%;padding:10px 12px;border-radius:12px;background:#101f2e;border:1px solid #263c50;color:#fff}.user{padding:13px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:10px;cursor:pointer}.user:hover,.user.active{background:#13283a}.user b{font-size:14px}.user small{display:block;color:#8298aa;margin-top:3px}.thread{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}.threadhead{height:60px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0b1726;border-bottom:1px solid rgba(255,255,255,.08)}.messages{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:5px}.row{max-width:78%;position:relative}.row.me{align-self:flex-end}.bubble{padding:8px 10px;background:#15293b;border:1px solid #233f53;border-radius:15px 15px 15px 4px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.4}.me .bubble{background:linear-gradient(135deg,#5c4bec,#7345e7);border-radius:15px 15px 4px 15px}.meta{font-size:9px;text-align:right;color:#b2c0cc;margin-top:3px}.actions{display:none;position:absolute;top:100%;right:0;z-index:20;background:#122331;border:1px solid #2c4658;border-radius:12px;padding:5px;min-width:150px;box-shadow:0 18px 40px #000b}.row.open .actions{display:block}.actions button{display:block;width:100%;padding:9px;text-align:left;background:none;color:#fff;border-radius:8px}.actions button:hover{background:#203748}.typing{height:18px;color:#72ddb1;padding-left:14px;font-size:11px}.composer{display:flex;gap:7px;align-items:flex-end;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#0a1622;border-top:1px solid rgba(255,255,255,.08)}textarea{flex:1;min-width:0;min-height:42px;max-height:100px;resize:none;border-radius:21px;padding:10px 14px;background:#102031;color:#fff;border:1px solid #284154;outline:none}.send{width:44px;height:44px;border-radius:50%;background:#6852f5;color:#fff;font-size:20px}.plus{width:44px;height:44px;border-radius:50%;background:#15283a;color:#fff;font-size:24px}.wrap{position:relative}.menu{display:none;position:absolute;bottom:50px;left:0;background:#132535;border:1px solid #294354;border-radius:14px;padding:6px;min-width:150px}.wrap.open .menu{display:block}.menu button{display:block;width:100%;background:none;color:#fff;text-align:left;padding:10px;border-radius:8px}.menu button:hover{background:#203a4b}.poll{border:1px solid #2d4859;background:#102635;border-radius:12px;padding:10px}.poll button{display:block;width:100%;margin-top:6px;padding:8px;background:#183542;color:#fff;border-radius:8px;text-align:left}.file{padding:10px;border-radius:11px;background:#102736}.file a{color:#7de4b5}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:100}.modal.show{display:grid}.card{background:#0f1e2b;border:1px solid #2b4658;border-radius:18px;padding:17px;width:min(410px,92%)}.em{display:flex;flex-wrap:wrap;gap:7px}.em button{font-size:23px;background:#142a39;padding:8px;border-radius:10px}@media(max-width:760px){.users{display:none}.row{max-width:88%}}
</style></head><body><div class="a"><header class="head"><div class="av">A</div><div><b>HiddenChat Admin</b><div style="font-size:11px;color:#8298aa">Private inbox</div></div><div class="sp"></div><button class="btn" onclick="location.href='index.html'">⌂</button></header><div class="layout"><aside class="users"><div class="search"><input id="search" placeholder="Search users..." oninput="renderUsers()"></div><div id="userList"></div></aside><main class="thread"><div class="threadhead"><div class="av" id="peerAv">?</div><div><b id="peerName">Select a user</b><div id="peerState" style="font-size:11px;color:#8298aa">—</div></div></div><div id="typing" class="typing"></div><div id="messages" class="messages"><div style="margin:auto;color:#8298aa;text-align:center">Select a user from the inbox.</div></div><div class="composer"><div class="wrap" id="wrap"><button class="plus" onclick="toggleMenu()">＋</button><div class="menu"><button onclick="createPoll()">📊 Poll</button><button onclick="sendLink()">🔗 Link</button></div></div><textarea id="input" placeholder="Write a message..." oninput="typeOn()" onkeydown="key(event)"></textarea><button class="send" onclick="send()">➤</button></div></main></div></div><div id="modal" class="modal"></div><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="config.js"></script><script>
let peer=null,ref=null,users={},timer=null,replyTo=null;
loadAdminPassword().then(p=>{let entered=prompt('Admin password');if(entered!==p)location.href='index.html';else init()}).catch(()=>{let entered=prompt('Admin password');if(entered!=='seema12345')location.href='index.html';else init()});
function init(){db.ref('chats').on('value',s=>{users=s.val()||{};renderUsers()})}
function renderUsers(){let q=(document.getElementById('search').value||'').toLowerCase();let a=Object.entries(users).filter(([id,u])=>(u.user_name||u.name||'').toLowerCase().includes(q));userList.innerHTML=a.map(([id,u])=>`<div class="user ${peer?.uid===id?'active':''}" onclick="openUser('${id}')"><div class="av">${esc((u.user_name||u.name||'?')[0])}</div><div><b>${esc(u.user_name||u.name||'User')}</b><small>${esc(u.last_message||'No messages yet')}</small></div></div>`).join('')||'<div style="padding:20px;color:#8298aa">No chats.</div>'}
function openUser(uid){peer={uid,name:users[uid]?.user_name||users[uid]?.name||'User'};peerName.textContent=peer.name;peerAv.textContent=peer.name[0].toUpperCase();peerState.textContent=users[uid]?.user_online?'online':'offline';if(ref)ref.off();ref=db.ref('chats/'+uid);ref.on('value',s=>{let d=s.val()||{};renderMessages(d.messages||{});peerState.textContent=d.user_online?'online':d.last_seen?'last seen '+new Date(d.last_seen).toLocaleString():'offline'});db.ref('chats/'+uid+'/typing/user').on('value',s=>typing.textContent=s.val()?.typing?'typing…':'');db.ref('chats/'+uid).update({admin_online:true});renderUsers()}
function renderMessages(data){let a=Object.entries(data).sort((x,y)=>(x[1].timestamp||0)-(y[1].timestamp||0));messages.innerHTML=a.map(([id,m])=>bubble(id,m)).join('')||'<div style="margin:auto;color:#8298aa">No messages.</div>';messages.scrollTop=messages.scrollHeight}
function bubble(id,m){let mine=m.sender==='admin',body=m.type==='link'?`🔗 <a href="${esc(m.url||'#')}" target="_blank" style="color:#bcefff">${esc(m.url||'')}</a>`:m.type==='file'?`<div class="file">📎 ${esc(m.name||'File')}<br><a href="${esc(m.url||'#')}" target="_blank">Open file</a></div>`:m.type==='poll'?poll(id,m):esc(m.message||m.text||'');let rx=m.reactions?Object.values(m.reactions).join(' '):'';return `<div class="row ${mine?'me':''}" id="r_${id}" onclick="openActions('${id}',event)"><div class="bubble">${m.reply_text?`<div style="border-left:3px solid #76dfb0;padding:4px 7px;background:#ffffff0b;border-radius:6px;margin-bottom:5px;font-size:11px">↩ ${esc(m.reply_text)}</div>`:''}${body}<div class="meta">${new Date(m.timestamp||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ${mine?'✓✓':''}</div>${rx?`<div style="font-size:12px">${esc(rx)}</div>`:''}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="reply('${id}')">↩ Reply</button><button onclick="react('${id}')">😊 React</button><button onclick="edit('${id}')">✏️ Edit</button><button onclick="del('${id}')">🗑 Delete</button><button onclick="copy('${id}')">📋 Copy</button><button onclick="pin('${id}')">📌 Pin</button></div></div>`}
function openActions(id,e){if(e.target.closest('.actions'))return;document.querySelectorAll('.row.open').forEach(x=>x.classList.remove('open'));document.getElementById('r_'+id)?.classList.add('open')};function closeActions(){document.querySelectorAll('.row.open').forEach(x=>x.classList.remove('open'))}
function sendBase(o){o.sender='admin';o.sender_name='Admin';o.timestamp=firebase.database.ServerValue.TIMESTAMP;if(replyTo){o.reply_to=replyTo.id;o.reply_text=replyTo.text}return ref.child('messages').push().set(o).then(()=>ref.update({last_message:o.message||o.text||o.type,last_sender:'admin',last_timestamp:new Date().toISOString()}))}
function send(){if(!peer)return;let t=input.value.trim();if(!t)return;sendBase({type:'text',message:t}).then(()=>{input.value='';replyTo=null;input.placeholder='Write a message...';setTyping(false)})}
function reply(id){ref.child('messages/'+id).once('value').then(s=>{let m=s.val()||{};replyTo={id,text:m.message||m.text||m.question||'message'};input.placeholder='Reply: '+replyTo.text;input.focus();closeActions()})}
function react(id){emoji(e=>ref.child('messages/'+id+'/reactions/admin').set(e));closeActions()};function edit(id){ref.child('messages/'+id).once('value').then(s=>{let m=s.val()||{};let t=prompt('Edit:',m.message||'');if(t!==null&&t.trim())ref.child('messages/'+id).update({message:t.trim(),edited:true});closeActions()})};function del(id){if(confirm('Delete message?'))ref.child('messages/'+id).remove();closeActions()};function copy(id){ref.child('messages/'+id).once('value').then(s=>navigator.clipboard?.writeText(s.val()?.message||s.val()?.url||''));closeActions()};function pin(id){ref.update({pinned_message:id});alert('Pinned');closeActions()}
function emoji(cb){modal.innerHTML='<div class="card"><h3>Reaction</h3><div class="em">'+['❤️','👍','😂','😮','😢','🔥','👏','🙏'].map(e=>`<button onclick="pick('${e}')">${e}</button>`).join('')+'</div></div>';modal.classList.add('show');window.pick=e=>{cb(e);modal.classList.remove('show')}}
function toggleMenu(){wrap.classList.toggle('open')};function sendLink(){let u=prompt('Link:');if(u)sendBase({type:'link',url:u});wrap.classList.remove('open')};function createPoll(){let q=prompt('Poll question:');if(!q)return;let o=prompt('Options separated by |','Yes|No');if(o)sendBase({type:'poll',question:q,options:o.split('|').map(x=>x.trim()).filter(Boolean),votes:{}});wrap.classList.remove('open')};function poll(id,m){return `<div class="poll"><b>📊 ${esc(m.question||'Poll')}</b>${(m.options||[]).map((o,i)=>`<button onclick="event.stopPropagation();vote('${id}',${i})">${esc(o)}</button>`).join('')}</div>`};function vote(id,i){ref.child('messages/'+id+'/votes/'+i+'/admin').set(true)}
function typeOn(){setTyping(true);clearTimeout(timer);timer=setTimeout(()=>setTyping(false),1400)};function setTyping(v){if(peer)db.ref('chats/'+peer.uid+'/typing/admin').set({typing:v,ts:firebase.database.ServerValue.TIMESTAMP})};function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
