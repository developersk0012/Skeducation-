<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilChat</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><div class="logo">V</div><div><div class="title">VeilChat</div><div class="sub">Private • testing</div></div><div class="grow"></div><button class="icon" onclick="location.href='settings.html'">⚙</button><button class="icon" onclick="location.href='admin.html'">🛠</button></header><div class="layout"><aside class="side"><div class="search"><input id="search" placeholder="Search people…" oninput="renderUsers()"></div><div id="list" class="list"></div></aside><main class="main"><div id="welcome" class="welcome"><div class="hero">💬</div><h2>Welcome to VeilChat</h2><p>Select a person to start chatting.</p><div class="featurebar"><span class="chip">↩ Reply</span><span class="chip">😊 Reactions</span><span class="chip">⌨ Typing</span><span class="chip">📊 Polls</span><span class="chip">📎 Files</span><span class="chip">🔍 Search</span></div></div><div id="chat" class="chat"><div class="chathead"><button class="icon back" onclick="closeChat()">←</button><div class="ava" id="peerA">?</div><div><div class="title" id="peerN">Chat</div><div class="status" id="peerS">offline</div></div><div class="grow"></div><button class="icon" onclick="findInChat()">⌕</button><button class="icon" onclick="clearChat()">⋮</button></div><div id="typing" class="typing"></div><div id="messages" class="messages"></div><div class="composer"><div class="attach" id="attach"><button class="round" onclick="attach.classList.toggle('open')">＋</button><div class="sheet"><button onclick="pick('image/*')">📷 Photo</button><button onclick="pick('video/*')">🎥 Video</button><button onclick="pick('.pdf,.doc,.docx,.txt')">📄 Document</button><button onclick="sendLink()">🔗 Link</button><button onclick="makePoll()">📊 Poll</button></div></div><textarea id="input" placeholder="Type a message…" oninput="typingNow()" onkeydown="keySend(event)"></textarea><button class="round send" onclick="send()">➤</button></div></div></main></div><input id="file" type="file" hidden onchange="upload(this.files[0])"><div id="modal" class="modal" onclick="if(event.target===this)hideModal()"><div class="card" id="modalCard"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="config.js"></script><script>
const me=user();if(!me)location.href="login.html";let users={},peer=null,ref=null,tref=null,tt=null,reply=null;
db.ref(NS+"/users/"+me.uid).set({name:me.name,online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});db.ref(NS+"/users/"+me.uid).onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
db.ref(NS+"/users").on("value",s=>{users=s.val()||{};renderUsers()});
function renderUsers(){let q=(search.value||"").toLowerCase();let admin=`<div class="row active" onclick="openChat('admin')"><div class="ava">A</div><div class="rmain"><div class="rline"><b>VeilChat Admin</b><span class="time">always</span></div><div class="preview">Official testing conversation • start here</div></div></div>`;let people=Object.entries(users).filter(([id,u])=>id!==me.uid&&(u.name||"").toLowerCase().includes(q)).map(([id,u])=>`<div class="row" onclick="openChat('${id}')"><div class="ava">${esc((u.name||"?")[0].toUpperCase())}</div><div class="rmain"><div class="rline"><b>${esc(u.name||"User")}</b><span class="time">${u.online?"online":""}</span></div><div class="preview">${u.online?"🟢 online":"last seen"}</div></div></div>`).join("");list.innerHTML=admin+people}
function chatKey(id){return [me.uid,id].sort().join("__")}function path(){return NS+"/chats/"+chatKey(peer.uid)+"/messages"}function openChat(id){peer={uid:id,name:id==="admin"?"VeilChat Admin":(users[id]?.name||"User")};welcome.style.display="none";chat.style.display="flex";peerN.textContent=peer.name;peerA.textContent=peer.name[0].toUpperCase();peerS.textContent=id==="admin"?"available":(users[id]?.online?"online":"offline");if(ref)ref.off();if(tref)tref.off();ref=db.ref(path());ref.on("value",s=>render(s.val()||{}));tref=db.ref(NS+"/chats/"+chatKey(peer.uid)+"/typing/"+peer.uid);tref.on("value",s=>typing.textContent=s.val()?.typing?"typing…":"");}
function closeChat(){if(ref)ref.off();if(tref)tref.off();chat.style.display="none";welcome.style.display="block";peer=null}
function render(data){let arr=Object.entries(data).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));messages.innerHTML=arr.map(([id,m])=>bubble(id,m)).join("");messages.scrollTop=messages.scrollHeight}
function bubble(id,m){let mine=m.sender===me.uid;let body=m.type==="file"?`<div class="file">📎 <b>${esc(m.name||"File")}</b><br><a href="${esc(m.url||"#")}" target="_blank" rel="noopener">Open file</a></div>`:m.type==="link"?`🔗 <a href="${esc(m.url||"#")}" target="_blank" style="color:#70dfad">${esc(m.url||"")}</a>`:m.type==="poll"?pollHtml(id,m):`<div class="text">${esc(m.text||"")}</div>`;let rx=m.reactions?Object.values(m.reactions).join(" "):"";return `<div class="msg ${mine?"mine":""}" id="m_${id}" onclick="actions('${id}',event)"><div class="bubble">${m.replyText?`<div class="reply">↩ ${esc(m.replyText)}</div>`:""}${body}<div class="meta">${time(m.ts)} ${mine?(m.read?"✓✓":"✓"):""}</div>${rx?`<span class="reaction">${esc(rx)}</span>`:""}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="replyTo('${id}')">↩ Reply</button><button onclick="react('${id}')">😊 React</button><button onclick="copy('${id}')">📋 Copy</button>${mine?`<button onclick="del('${id}')">🗑 Delete</button>`:""}</div></div>`}
function actions(id,e){if(e.target.closest(".actions"))return;document.querySelectorAll(".msg.open").forEach(x=>x.classList.remove("open"));document.getElementById("m_"+id)?.classList.add("open")}
function closeActions(){document.querySelectorAll(".msg.open").forEach(x=>x.classList.remove("open"))}
function sendBase(o){let r=ref.push();o.sender=me.uid;o.senderName=me.name;o.ts=firebase.database.ServerValue.TIMESTAMP;if(reply){o.replyId=reply.id;o.replyText=reply.text;reply=null;input.placeholder="Type a message…"}return r.set(o)}
function send(){let v=input.value.trim();if(!v||!peer)return;sendBase({type:"text",text:v});input.value="";setTyping(false)}
function keySend(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}
function replyTo(id){ref.child(id).once("value").then(s=>{let m=s.val()||{};reply={id,text:m.text||m.name||"message"};input.placeholder="Reply: "+reply.text;input.focus();closeActions()})}
function react(id){modalCard.innerHTML='<h3>React</h3><div class="emoji">'+["❤️","👍","😂","😮","😢","🔥","👏","🙏"].map(e=>`<button onclick="setRx('${id}','${e}')">${e}</button>`).join("")+"</div>";modal.classList.add("show");closeActions()}
function setRx(id,e){ref.child(id).child("reactions").child(me.uid).set(e);hideModal()}
function copy(id){ref.child(id).once("value").then(s=>navigator.clipboard?.writeText(s.val()?.text||s.val()?.url||""));closeActions()}
function del(id){if(confirm("Delete your message?"))ref.child(id).remove();closeActions()}
function typingNow(){setTyping(true);clearTimeout(tt);tt=setTimeout(()=>setTyping(false),1400)}
function setTyping(v){if(peer)db.ref(NS+"/chats/"+chatKey(peer.uid)+"/typing/"+me.uid).set({typing:v,ts:firebase.database.ServerValue.TIMESTAMP})}
function pick(a){file.accept=a;file.click();attach.classList.remove("open")}
async function upload(f){if(!f||!peer)return;if(!storage)return alert("Firebase Storage unavailable");try{let r=storage.ref(NS+"/files/"+me.uid+"/"+Date.now()+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_"));let s=await r.put(f);let url=await s.ref.getDownloadURL();sendBase({type:"file",name:f.name,mime:f.type,size:f.size,url})}catch(e){alert("Upload failed: "+e.message)}}
function sendLink(){let u=prompt("Paste link");if(u)sendBase({type:"link",url:u});attach.classList.remove("open")}
function makePoll(){let q=prompt("Poll question");if(!q)return;let o=prompt("Options separated by |","Yes|No");if(o)sendBase({type:"poll",question:q,options:o.split("|").map(x=>x.trim()).filter(Boolean),votes:{}});attach.classList.remove("open")}
function pollHtml(id,m){return `<div class="poll"><strong>📊 ${esc(m.question)}</strong>${(m.options||[]).map((o,i)=>`<button onclick="event.stopPropagation();vote('${id}',${i})">${esc(o)} <span style="color:#7f99a5">${m.votes?.[i]?Object.keys(m.votes[i]).length:0}</span></button>`).join("")}</div>`}function vote(id,i){ref.child(id).child("votes").child(i).child(me.uid).set(true)}
function findInChat(){let q=prompt("Search this chat");if(!q)return;let n=[...document.querySelectorAll(".text")].find(x=>x.textContent.toLowerCase().includes(q.toLowerCase()));n?.scrollIntoView({behavior:"smooth",block:"center"})}
function clearChat(){if(peer&&confirm("Delete this conversation?"))ref.remove()}
function hideModal(){modal.classList.remove("show")}
</script></body></html>
