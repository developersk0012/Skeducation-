<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiddenChat</title><link rel="stylesheet" href="style.css"></head><body><div class="app">
<header class="top"><div class="avatar" id="meAvatar">U</div><div><h1>HiddenChat</h1><small id="status">Private chat</small></div><div class="spacer"></div><button class="iconbtn" onclick="location.href='settings.html'">⚙</button><button class="iconbtn" onclick="logout()">↪</button></header>
<div class="layout"><aside class="sidebar"><div class="search"><input id="searchUsers" placeholder="Search chats..." oninput="renderUsers()"></div><div id="chatlist" class="chatlist"></div></aside>
<main class="main"><div id="empty" class="empty"><div style="font-size:42px">💬</div><h2>Select a chat</h2><p>Choose a conversation from the list.</p></div><div id="chatView" style="display:none;height:100%;min-height:0;flex-direction:column"><div class="top" style="height:58px"><div class="avatar" id="peerAvatar">?</div><div><h1 id="peerName">Chat</h1><small id="peerStatus">offline</small></div><div class="spacer"></div><button class="iconbtn" onclick="searchInChat()">⌕</button></div><div id="typing" class="typing"></div><div id="messages" class="messages"></div><div class="composer"><div class="attachWrap" id="aw"><button class="round" onclick="toggleAttach()">＋</button><div class="attachMenu"><button onclick="pickFile('image/*')">📷 Photo</button><button onclick="pickFile('video/*')">🎥 Video</button><button onclick="pickFile('.pdf,.doc,.docx,.txt')">📄 Document</button><button onclick="sendLink()">🔗 Link</button><button onclick="createPoll()">📊 Poll</button></div></div><textarea id="input" rows="1" placeholder="Type a message..." oninput="typing()" onkeydown="keySend(event)"></textarea><button class="round send" onclick="sendText()">➤</button></div></div></main></div><input id="file" type="file" hidden onchange="uploadFile(this.files[0])"></div>
<div id="modal" class="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalInner"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="config.js"></script>
<script>
let me=getUser(), peer=null, msgRef=null, typingTimer=null, users={};
if(!me)location.href='login.html'; document.getElementById('meAvatar').textContent=me.name[0].toUpperCase();
db.ref('chat_users').child(me.uid).set({name:me.name,online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});
db.ref('chat_users').child(me.uid).onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
db.ref('chat_users').on('value',s=>{users=s.val()||{};renderUsers()});
function renderUsers(){let q=(document.getElementById('searchUsers').value||'').toLowerCase();let html='';Object.entries(users).forEach(([uid,u])=>{if(uid===me.uid||!u.name?.toLowerCase().includes(q))return;html+=`<div class="chatrow" onclick="openChat('${uid}')"><div class="avatar">${esc((u.name||'?')[0].toUpperCase())}</div><div class="meta"><b>${esc(u.name||'User')}</b><p>${u.online?'🟢 online':'last seen '+fmtDate(u.lastSeen)}</p></div></div>`});document.getElementById('chatlist').innerHTML=html||'<div style="padding:20px;color:#8299a8">No other users yet.</div>'}
function keySend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}}
function path(){return 'private_chats/'+[me.uid,peer.uid].sort().join('__')+'/messages'}
function openChat(uid){peer={uid,name:users[uid]?.name||'User'};document.getElementById('empty').style.display='none';document.getElementById('chatView').style.display='flex';document.getElementById('peerName').textContent=peer.name;document.getElementById('peerAvatar').textContent=peer.name[0].toUpperCase();watchPeer();if(msgRef)msgRef.off();msgRef=db.ref(path());msgRef.on('value',s=>renderMessages(s.val()||{}));db.ref('private_chats/'+[me.uid,peer.uid].sort().join('__')+'/typing/'+peer.uid).on('value',s=>document.getElementById('typing').textContent=s.val()?.typing?'typing…':'')}
function watchPeer(){db.ref('chat_users/'+peer.uid).on('value',s=>{let u=s.val()||{};document.getElementById('peerStatus').textContent=u.online?'online':u.lastSeen?'last seen '+fmtDate(u.lastSeen):'offline'})}
function renderMessages(data){let el=document.getElementById('messages');let arr=Object.entries(data).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));el.innerHTML=arr.map(([id,m])=>bubble(id,m)).join('');el.scrollTop=el.scrollHeight}
function bubble(id,m){let mine=m.sender===me.uid;let reaction=m.reactions?Object.values(m.reactions).join(' '):'';let body=m.type==='file'?`<div class="filecard">📎 <b>${esc(m.name||'File')}</b><br><a href="${esc(m.url||'#')}" target="_blank" rel="noopener">Open file</a></div>`:m.type==='link'?`🔗 <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a>`:m.type==='poll'?pollHtml(id,m):`<div class="msgtext">${esc(m.text||'')}</div>`;return `<div class="msg ${mine?'mine':''}" id="m_${id}" onclick="toggleActions('${id}',event)"><div class="bubble">${m.replyText?`<div class="reply">↩ ${esc(m.replyText)}</div>`:''}${body}<div class="metaLine">${fmtTime(m.ts)} ${mine?(m.read?'✓✓':'✓'):''}</div>${reaction?`<span class="reaction">${esc(reaction)}</span>`:''}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="replyMsg('${id}')">↩ Reply</button><button onclick="reactMsg('${id}')">😊 React</button>${mine?`<button onclick="deleteMsg('${id}')">🗑 Delete</button>`:''}<button onclick="copyMsg('${id}')">📋 Copy</button></div></div>`}
function toggleActions(id,e){if(e.target.closest('.actions'))return;document.querySelectorAll('.msg.open').forEach(x=>x.classList.remove('open'));document.getElementById('m_'+id)?.classList.add('open')}
function sendBase(obj){let ref=msgRef.push();obj.sender=me.uid;obj.senderName=me.name;obj.ts=firebase.database.ServerValue.TIMESTAMP;return ref.set(obj)}
function sendText(){let t=document.getElementById('input').value.trim();if(!t||!peer)return;sendBase({type:'text',text:t});document.getElementById('input').value='';setTyping(false)}
function replyMsg(id){let snap;msgRef.child(id).once('value').then(s=>{snap=s.val();document.getElementById('input').value='';document.getElementById('input').focus();document.getElementById('input').placeholder='Reply: '+(snap.text||snap.name||'message');window.replyTo={id,text:snap.text||snap.name||'message'};closeActions()})}
function closeActions(){document.querySelectorAll('.msg.open').forEach(x=>x.classList.remove('open'))}
function reactMsg(id){msgRef.child(id).child('reactions').child(me.uid).once('value').then(s=>{let old=s.val();showEmoji(e=>msgRef.child(id).child('reactions').child(me.uid).set(e),old)});closeActions()}
function deleteMsg(id){if(confirm('Delete this message?'))msgRef.child(id).remove();closeActions()}
function copyMsg(id){msgRef.child(id).once('value').then(s=>{navigator.clipboard?.writeText(s.val()?.text||s.val()?.url||'')});closeActions()}
function showEmoji(cb,old){document.getElementById('modalInner').innerHTML='<h3>Choose reaction</h3><div class="emojiGrid">'+['❤️','👍','😂','😮','😢','🔥','👏','🙏'].map(e=>`<button onclick="window._emoji('${e}')">${e}</button>`).join('')+'</div>';window._emoji=e=>{cb(e);closeModal()};document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function typing(){setTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>setTyping(false),1400)}
function setTyping(v){if(!peer)return;db.ref('private_chats/'+[me.uid,peer.uid].sort().join('__')+'/typing/'+me.uid).set({typing:v,ts:firebase.database.ServerValue.TIMESTAMP})}
function toggleAttach(){document.getElementById('aw').classList.toggle('open')}
function pickFile(acc){document.getElementById('file').accept=acc;document.getElementById('file').click();document.getElementById('aw').classList.remove('open')}
async function uploadFile(file){if(!file||!peer)return;if(!storage)return alert('Firebase Storage is not configured.');let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let ref=storage.ref('hiddenchat/'+me.uid+'/'+Date.now()+'_'+safe);try{let snap=await ref.put(file);let url=await snap.ref.getDownloadURL();await sendBase({type:'file',name:file.name,url,mime:file.type,size:file.size})}catch(e){alert('Upload failed: '+e.message)}}
function sendLink(){let u=prompt('Paste link:');if(u)sendBase({type:'link',url:u});toggleAttach()}
function createPoll(){let q=prompt('Poll question:');if(!q)return;let opts=prompt('Options separated by |','Yes|No');if(!opts)return;sendBase({type:'poll',question:q,options:opts.split('|').map(x=>x.trim()).filter(Boolean),votes:{}});toggleAttach()}
function pollHtml(id,m){return `<div class="poll"><b>📊 ${esc(m.question)}</b>${(m.options||[]).map((o,i)=>`<button onclick="event.stopPropagation();vote('${id}',${i})">${esc(o)} ${m.votes&&m.votes[i]?`· ${Object.keys(m.votes[i]).length}`:''}</button>`).join('')}</div>`}
function vote(id,i){msgRef.child(id).child('votes').child(i).child(me.uid).set(true)}
function searchInChat(){let q=prompt('Search text:');if(!q)return;let found=[...document.querySelectorAll('.msgtext')].find(x=>x.textContent.toLowerCase().includes(q.toLowerCase()));found?.scrollIntoView({behavior:'smooth',block:'center'})}
</script></body></html>
