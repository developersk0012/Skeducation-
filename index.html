<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilChat</title><link rel="stylesheet" href="style.css"></head><body><div class="shell">
<header class="header"><div class="brandmark">V</div><div class="brand"><h1>VeilChat</h1><small>Private • testing space</small></div><div class="grow"></div><button class="hbtn" onclick="location.href='settings.html'">⚙</button><button class="hbtn" onclick="logout()">↪</button></header>
<div class="layout"><aside class="side"><div class="searchbox"><input id="search" placeholder="Search people..." oninput="renderUsers()"></div><div id="list" class="list"></div></aside>
<main class="main"><div id="welcome" class="welcome"><div class="hero">💬</div><h2>Your conversations</h2><p>Choose someone from the list to start.</p></div><div id="chat" class="chat"><div class="chathead"><button class="hbtn back" onclick="closeChat()">←</button><div class="ava" id="peerA">?</div><div><div class="chatname" id="peerN">Chat</div><div class="chatstatus" id="peerS">offline</div></div><div class="grow"></div><button class="hbtn" onclick="findText()">⌕</button><button class="hbtn" onclick="clearLocal()">⋮</button></div><div id="typing" class="typing"></div><div id="messages" class="messages"></div><div class="composer"><div class="attach" id="attach"><button class="round" onclick="toggleSheet()">＋</button><div class="sheet"><button onclick="chooseFile('image/*')">📷 Photo</button><button onclick="chooseFile('video/*')">🎥 Video</button><button onclick="chooseFile('.pdf,.doc,.docx,.txt')">📄 Document</button><button onclick="sendLink()">🔗 Link</button><button onclick="makePoll()">📊 Poll</button></div></div><textarea id="input" rows="1" placeholder="Type a message…" oninput="typingNow()" onkeydown="sendKey(event)"></textarea><button class="round send" onclick="sendText()">➤</button></div></div></main></div><input id="file" type="file" hidden onchange="upload(this.files[0])"><div id="modal" class="modal" onclick="if(event.target===this)hideModal()"><div class="card" id="modalCard"></div></div><div id="toast" class="toast"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="config.js"></script><script>
const me=JSON.parse(localStorage.getItem('veil_user')||'null');if(!me)location.href='login.html';let users={},peer=null,ref=null,peerTypingRef=null,typingTimer=null,replyTo=null;
db.ref('veil_users').child(me.uid).set({name:me.name,online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});db.ref('veil_users').child(me.uid).onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
db.ref('veil_users').on('value',s=>{users=s.val()||{};renderUsers()});
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function t(ts){return new Intl.DateTimeFormat([],{hour:'2-digit',minute:'2-digit'}).format(new Date(ts||Date.now()))}
function renderUsers(){const q=(search.value||'').toLowerCase();list.innerHTML=Object.entries(users).filter(([id,u])=>id!==me.uid&&(u.name||'').toLowerCase().includes(q)).map(([id,u])=>`<div class="row ${peer?.uid===id?'active':''}" onclick="openChat('${id}')"><div class="ava">${esc((u.name||'?')[0].toUpperCase())}</div><div class="rowmain"><div class="rowtop"><b>${esc(u.name||'User')}</b><span class="time">${u.online?'online':''}</span></div><div class="preview">${u.online?'🟢 available':'last seen'}</div></div></div>`).join('')||'<div style="padding:20px;color:#78929e">No other users online yet.</div>'}
function key(a,b){return [a,b].sort().join('__')}function path(){return 'veil_chats/'+key(me.uid,peer.uid)+'/messages'}function typingPath(uid){return 'veil_chats/'+key(me.uid,peer.uid)+'/typing/'+uid}
function openChat(uid){peer={uid,name:users[uid]?.name||'User'};welcome.style.display='none';chat.style.display='flex';peerN.textContent=peer.name;peerA.textContent=peer.name[0].toUpperCase();peerS.textContent=users[uid]?.online?'online':'offline';if(ref)ref.off();if(peerTypingRef)peerTypingRef.off();ref=db.ref(path());ref.on('value',s=>render(s.val()||{}));peerTypingRef=db.ref(typingPath(peer.uid));peerTypingRef.on('value',s=>typing.textContent=s.val()?.typing?'typing…':'');renderUsers()}
function closeChat(){peer=null;chat.style.display='none';welcome.style.display='block';if(ref)ref.off();if(peerTypingRef)peerTypingRef.off()}
function render(data){const arr=Object.entries(data).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));messages.innerHTML=arr.map(([id,m])=>bubble(id,m)).join('');messages.scrollTop=messages.scrollHeight}
function bubble(id,m){const mine=m.sender===me.uid;let body=m.type==='file'?`<div class="file">📎 <b>${esc(m.name||'File')}</b><br><a href="${esc(m.url||'#')}" target="_blank" rel="noopener">Open file</a></div>`:m.type==='link'?`🔗 <a href="${esc(m.url||'#')}" target="_blank" rel="noopener" style="color:#72dfae">${esc(m.url||'')}</a>`:m.type==='poll'?poll(id,m):`<div class="txt">${esc(m.text||'')}</div>`;let rx=m.reactions?Object.values(m.reactions).join(' '):'';return `<div class="msg ${mine?'mine':''}" id="m_${id}" onclick="openActions('${id}',event)"><div class="bubble">${m.replyText?`<div class="replybox">↩ ${esc(m.replyText)}</div>`:''}${body}<div class="msgmeta">${t(m.ts)} ${mine?(m.read?'✓✓':'✓'):''}</div>${rx?`<span class="rx">${esc(rx)}</span>`:''}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="doReply('${id}')">↩ Reply</button><button onclick="doReact('${id}')">😊 React</button><button onclick="copyMsg('${id}')">📋 Copy</button>${mine?`<button onclick="delMsg('${id}')">🗑 Delete</button>`:''}</div></div>`}
function openActions(id,e){if(e.target.closest('.actions'))return;document.querySelectorAll('.msg.open').forEach(x=>x.classList.remove('open'));document.getElementById('m_'+id)?.classList.add('open')}
function closeActions(){document.querySelectorAll('.msg.open').forEach(x=>x.classList.remove('open'))}
function sendBase(o){if(!peer)return;const r=ref.push();o.sender=me.uid;o.senderName=me.name;o.ts=firebase.database.ServerValue.TIMESTAMP;if(replyTo){o.replyId=replyTo.id;o.replyText=replyTo.text;replyTo=null;input.placeholder='Type a message…'}return r.set(o)}
function sendText(){const v=input.value.trim();if(!v||!peer)return;sendBase({type:'text',text:v});input.value='';setTyping(false)}
function sendKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}}
function doReply(id){ref.child(id).once('value').then(s=>{const m=s.val()||{};replyTo={id,text:m.text||m.name||'message'};input.placeholder='Reply: '+replyTo.text;input.focus();closeActions()})}
function doReact(id){const box=document.getElementById('modalCard');box.innerHTML='<h3>React to message</h3><div class="emojis">'+['❤️','👍','😂','😮','😢','🔥','👏','🙏'].map(e=>`<button onclick="setReaction('${id}','${e}')">${e}</button>`).join('')+'</div>';modal.classList.add('show');closeActions()}
function setReaction(id,e){ref.child(id).child('reactions').child(me.uid).set(e);hideModal()}
function copyMsg(id){ref.child(id).once('value').then(s=>navigator.clipboard?.writeText(s.val()?.text||s.val()?.url||''));closeActions();toastMsg('Copied')}
function delMsg(id){if(confirm('Delete this message?'))ref.child(id).remove();closeActions()}
function typingNow(){setTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>setTyping(false),1300)}
function setTyping(v){if(!peer)return;db.ref(typingPath(me.uid)).set({typing:v,ts:firebase.database.ServerValue.TIMESTAMP})}
function toggleSheet(){attach.classList.toggle('open')}
function chooseFile(a){file.accept=a;file.click();attach.classList.remove('open')}
async function upload(f){if(!f||!peer)return;if(!storage)return toastMsg('Storage is not configured');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');try{const r=storage.ref('veil_files/'+me.uid+'/'+Date.now()+'_'+safe);const s=await r.put(f);const url=await s.ref.getDownloadURL();await sendBase({type:'file',name:f.name,mime:f.type,size:f.size,url})}catch(e){toastMsg('Upload failed')}}
function sendLink(){const u=prompt('Paste a link');if(u)sendBase({type:'link',url:u});attach.classList.remove('open')}
function makePoll(){const q=prompt('Poll question');if(!q)return;const o=prompt('Options separated by |','Yes|No');if(o)sendBase({type:'poll',question:q,options:o.split('|').map(x=>x.trim()).filter(Boolean),votes:{}});attach.classList.remove('open')}
function poll(id,m){return `<div class="poll"><strong>📊 ${esc(m.question)}</strong>${(m.options||[]).map((o,i)=>`<button onclick="event.stopPropagation();vote('${id}',${i})">${esc(o)} <span style="color:#7e9aa5">${m.votes?.[i]?Object.keys(m.votes[i]).length:0}</span></button>`).join('')}</div>`}
function vote(id,i){ref.child(id).child('votes').child(i).child(me.uid).set(true)}
function findText(){const q=prompt('Search in this chat');if(!q)return;const n=[...document.querySelectorAll('.txt')].find(x=>x.textContent.toLowerCase().includes(q.toLowerCase()));n?.scrollIntoView({behavior:'smooth',block:'center'})}
function clearLocal(){if(peer&&confirm('Clear this conversation for everyone?'))ref.remove()}
function hideModal(){modal.classList.remove('show')}
function toastMsg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
function logout(){localStorage.removeItem('veil_user');location.href='login.html'}
</script></body></html>
