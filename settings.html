<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilChat Settings</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><button class="icon" onclick="history.back()">←</button><div><div class="title">Settings</div><div class="sub">VeilChat</div></div></header><div style="padding:20px;max-width:500px;width:100%;margin:auto"><div class="card"><h3>Account</h3><p class="hint" id="who"></p><button class="primary" onclick="localStorage.removeItem('veil_v2_user');location.href='login.html'">Log out</button><hr style="border-color:#203440;margin:20px 0"><h3>Testing namespace</h3><p class="hint">This app stores data only under <b>veil_v2</b> in the testing Firebase project.</p></div></div></div><script>let u=JSON.parse(localStorage.getItem("veil_v2_user")||"null");who.textContent=u?"Signed in as "+u.name:"Not signed in"</script></body></html>
