<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilChat Settings</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header class="header"><button class="hbtn" onclick="history.back()">←</button><div class="brand"><h1>Settings</h1><small>VeilChat</small></div></header><div style="padding:20px;max-width:520px;width:100%;margin:auto"><div class="card"><h3>Account</h3><p class="hint" id="who"></p><button class="primary" onclick="localStorage.removeItem('veil_user');location.href='login.html'">Log out</button><hr style="border-color:#203440;margin:20px 0"><h3>Privacy-first design</h3><p class="hint">This standalone testing app uses a separate Firebase namespace (<b>veil_*</b>) so it does not depend on the SK Education database structure.</p></div></div></div><script>const u=JSON.parse(localStorage.getItem('veil_user')||'null');who.textContent=u?'Signed in as '+u.name:'Not signed in'</script></body></html>
